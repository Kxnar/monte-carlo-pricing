name: Numerical validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: mcpricing price --samples 2000
      - run: mcpricing benchmark --scenarios mixture --strikes 100 --sizes 1000 --groups 2 --repeats 2 --pilot-samples 500 --bootstrap 100 --output smoke-results
