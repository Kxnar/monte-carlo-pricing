[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-pricing-lab"
version = "0.3.0"
description = "Reproducible Asian portfolio pricing and variance-reduction workbench"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.optional-dependencies]
reference = ["QuantLib==1.43"]

[project.scripts]
mcpricing = "mcpricing.__main__:main"

[tool.setuptools.packages.find]
include = ["mcpricing*"]
