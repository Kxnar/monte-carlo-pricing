[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "monte-carlo-pricing-lab"
version = "0.2.0"
description = "Reproducible European option pricing and variance-reduction experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3"]

[project.scripts]
mcpricing = "mcpricing.__main__:main"

[tool.setuptools.packages.find]
include = ["mcpricing*"]
